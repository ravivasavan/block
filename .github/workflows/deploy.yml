name: deploy

on:
  push:
    branches: [main]
  schedule:
    # Just past midnight in SITE_TZ (default Australia/Melbourne), so the
    # day's block flips with the local date. If you fork this with a
    # different SITE_TZ, adjust this to shortly after your midnight in UTC.
    - cron: "5 14 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Palette samples per block, so daily builds only analyse new blocks.
      - uses: actions/cache@v4
        with:
          path: .cache
          key: palettes-${{ github.run_id }}
          restore-keys: |
            palettes-
      - run: npm run build
        env:
          ARENA_ACCESS_TOKEN: ${{ secrets.ARENA_ACCESS_TOKEN }}
          ARENA_CHANNEL: ${{ vars.ARENA_CHANNEL }}
          SITE_URL: ${{ vars.SITE_URL }}
          SITE_TZ: ${{ vars.SITE_TZ }}
          FONT_URL: ${{ vars.FONT_URL }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
